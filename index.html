<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dingus McGee</title>
  <style>
    body, html { margin:0; padding:0; background:#fdfdfd; height:100%; overflow:hidden; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif; }
    .hidden { display:none!important; }
    #mainScreen { position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.5); z-index:10; display:flex; justify-content:center; align-items:center; }
    #mainScreen .start-content { background:rgba(255,255,255,0.85); border-radius:24px; box-shadow:0 8px 32px rgba(0,0,0,0.10), 0 1.5px 6px rgba(0,0,0,0.04); padding:40px 32px 32px 32px; display:flex; flex-direction:column; align-items:center; min-width:320px; max-width:90vw; }
    #mainScreen .settings-panel { background:rgba(245,247,250,0.95); border-radius:14px; padding:18px 20px 12px 20px; box-shadow:0 1px 6px #0001; margin-top:18px; width:100%; max-width:340px; display:flex; flex-direction:column; gap:10px; }
    #mainScreen .settings-panel label { display:flex; justify-content:space-between; align-items:center; font-size:1rem; color:#333; margin:6px 0; }
    #mainScreen .settings-panel input[type="range"] { width:90px; }
    #mainScreen .settings-panel input[type="checkbox"] { transform:scale(1.2); margin-left:8px; }
    #feedback { position:fixed; left:50%; top:80px; transform:translateX(-50%); background:#222; color:#fff; font-size:1.2rem; padding:8px 22px; border-radius:12px; box-shadow:0 2px 8px #0002; z-index:20; pointer-events:none; opacity:0; transition:opacity 0.4s; }
    #feedback:not(.hidden) { opacity:1; }
    #hud { position:fixed; top:0; left:50%; transform:translateX(-50%); width:90%; max-width:600px; height:60px; background:rgba(255,255,255,0.95); display:flex; justify-content:center; align-items:center; gap:8px; padding:0 10px; box-sizing:border-box; border-bottom:1px solid #ccc; border-radius:0 0 10px 10px; z-index:4; }
    #hud div { font-size:14px; color:#222; display:flex; align-items:center; gap:4px; }
    button { padding:6px 10px; background:#333; color:white; border:none; border-radius:10px; cursor:pointer; z-index:4; }
    #settingsPanel { position:fixed; top:70px; right:5%; width:200px; background:rgba(50,50,50,0.95); color:white; font-size:13px; padding:10px; border-radius:12px; z-index:4; display:none; }
    #settingsPanel label { display:flex; justify-content:space-between; margin:4px 0; }
    #settingsPanel .shape-option { margin:6px 0; }
    #gameCanvas { width:90vw; max-width:600px; aspect-ratio:3/4; display:block; margin:70px auto 0; background:linear-gradient(#87CEEB,#fff); border-radius:12px; box-shadow:0 0 10px rgba(0,0,0,0.1); }
    #pauseControls {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      display: none;
      flex-direction: column;
      gap: 16px;
      align-items: center;
      background: rgba(30,30,30,0.92);
      padding: 30px 40px;
      border-radius: 18px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.25);
    }
    #pauseControls button {
      font-size: 20px;
      padding: 12px 28px;
      border-radius: 12px;
      background: #333;
      color: #fff;
      border: none;
      cursor: pointer;
    }
    #startScreen {
      background: linear-gradient(135deg, #f8fafc 0%, #e3e9f1 100%);
      color: #222;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      letter-spacing: 0.01em;
    }
    .start-content {
      background: rgba(255,255,255,0.85);
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.10), 0 1.5px 6px rgba(0,0,0,0.04);
      padding: 40px 32px 32px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 320px;
      max-width: 90vw;
    }
    .main-title {
      font-size: 2.6rem;
      font-weight: 700;
      margin-bottom: 18px;
      letter-spacing: -0.01em;
      color: #222;
      text-shadow: 0 2px 12px #fff8, 0 1px 0 #fff;
    }
    .start-btn {
      font-size: 1.3rem;
      padding: 14px 38px;
      border-radius: 16px;
      background: linear-gradient(90deg, #222 0%, #444 100%);
      color: #fff;
      font-weight: 600;
      border: none;
      margin-bottom: 18px;
      margin-top: 8px;
      box-shadow: 0 2px 8px #0001;
      transition: background 0.2s;
    }
    .start-btn:hover, .start-btn:focus {
      background: linear-gradient(90deg, #444 0%, #222 100%);
      outline: none;
    }
    .pause-hint {
      margin-bottom: 18px;
      font-size: 1.1rem;
      color: #888;
      text-shadow: none;
      font-weight: 500;
    }
    .controls-instructions {
      background: rgba(245,247,250,0.95);
      border-radius: 14px;
      padding: 18px 20px 12px 20px;
      box-shadow: 0 1px 6px #0001;
      margin-top: 0;
      width: 100%;
      max-width: 340px;
    }
    .controls-instructions h2 {
      font-size: 1.15rem;
      font-weight: 600;
      margin: 0 0 10px 0;
      color: #333;
      letter-spacing: 0.01em;
    }
    .controls-instructions ul {
      list-style: none;
      padding: 0;
      margin: 0 0 10px 0;
    }
    .controls-instructions li {
      margin-bottom: 7px;
      font-size: 1rem;
      color: #333;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .kbd {
      display: inline-block;
      background: #f3f4f6;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 0.98em;
      font-family: inherit;
      color: #222;
      margin: 0 2px;
      box-shadow: 0 1px 2px #0001;
    }
    .tip {
      margin-top: 10px;
      font-size: 1rem;
      color: #666;
      text-align: center;
    }
    @media (max-width: 500px) {
      .start-content { padding: 24px 6vw 18px 6vw; }
      .controls-instructions { padding: 12px 6vw 8px 6vw; }
      .main-title { font-size: 2rem; }
    }
    #pauseControls {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      display: none;
      flex-direction: column;
      align-items: center;
      background: linear-gradient(135deg, #f8fafc 0%, #e3e9f1 100%);
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.10), 0 1.5px 6px rgba(0,0,0,0.04);
      padding: 40px 32px 32px 32px;
      min-width: 320px;
      max-width: 90vw;
    }
    .pause-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    .pause-title {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 18px;
      color: #222;
      text-shadow: 0 2px 12px #fff8, 0 1px 0 #fff;
    }
    .pause-btn {
      font-size: 1.1rem;
      padding: 12px 38px;
      border-radius: 16px;
      background: linear-gradient(90deg, #222 0%, #444 100%);
      color: #fff;
      font-weight: 600;
      border: none;
      margin-bottom: 12px;
      margin-top: 8px;
      box-shadow: 0 2px 8px #0001;
      transition: background 0.2s;
      width: 100%;
      max-width: 220px;
    }
    .pause-btn:hover, .pause-btn:focus {
      background: linear-gradient(90deg, #444 0%, #222 100%);
      outline: none;
    }
    #pauseControlsInstructions {
      width: 100%;
      margin-bottom: 18px;
    }
    #pauseScreen {
      position: absolute;
      top: 0; left: 0; width: 100vw; height: 100vh;
      display: flex; justify-content: center; align-items: center;
      background: rgba(0,0,0,0.5);
      z-index: 10;
    }
    .settings-panel {
      background: rgba(245,247,250,0.95);
      border-radius: 14px;
      padding: 18px 20px 12px 20px;
      box-shadow: 0 1px 6px #0001;
      margin-top: 18px;
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .settings-panel label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1rem;
      color: #333;
      margin: 6px 0;
    }
    .settings-panel input[type="range"] {
      width: 90px;
    }
    .settings-panel input[type="checkbox"] {
      transform: scale(1.2);
      margin-left: 8px;
    }
    @media (max-width: 500px) {
      #pauseScreen .start-content { padding: 24px 6vw 18px 6vw; }
      .settings-panel { padding: 12px 6vw 8px 6vw; }
    }
  </style>
</head>
<body>
  <div id="startScreen">
    <div class="start-content">
      <h1 class="main-title">🎨 Dingus McGee</h1>
      <button id="mainActionBtn" class="start-btn">Start Game</button>
      <div id="pauseHint" class="pause-hint"></div>
      <div class="controls-instructions" id="mainControlsInstructions"></div>
      <button id="mainSettingsBtn" class="start-btn" style="margin-top:10px;">⚙️ Settings</button>
      <div id="mainSettingsPanel" class="settings-panel hidden">
        <h2 style="margin-top:0;font-size:1.1rem;color:#333;">Settings</h2>
        <label>
          Catcher Speed
          <input type="range" id="mainCatcherSpeed" min="5" max="100" value="25" />
          <button id="resetCatcherSpeedBtn" type="button" style="margin-left:8px;">Reset</button>
        </label>
        <label>
          Fall Speed
          <input type="range" id="mainFallSpeed" min="1" max="50" value="10" />
          <button id="resetFallSpeedBtn" type="button" style="margin-left:8px;">Reset</button>
        </label>
        <label>Miss Penalty
          <input type="checkbox" id="mainMissPenalty" />
        </label>
        <label>Music
          <input type="checkbox" id="mainMusicToggle" checked />
        </label>
        <label>Sound FX
          <input type="checkbox" id="mainSfxToggle" checked />
        </label>
      </div>
    </div>
  </div>
  <div id="feedback" class="hidden"></div>
  <div id="overlay" class="hidden"></div>
  <div id="gameOverScreen" class="hidden"><div><h2>Game Over</h2><p id="finalScore"></p><button id="restartBtn">Restart</button></div></div>
  <div id="hud" class="hidden">
    <div>⭐<span id="score">0</span></div>
    <div>XP:<span id="xp">0</span></div>
    <div>Level:<span id="level">1</span></div>
    <div>❤️<span id="lives">3</span></div>
    <div>🎯<span id="targetColorBox" style="width:20px;height:20px;border-radius:50%;border:1px solid #222;"></span></div>
    <div>🏆<span id="highScore">0</span></div>
  </div>
  <div id="pauseControls" class="hidden">
    <div class="pause-content">
      <h2 class="pause-title">⏸️ Paused</h2>
      <div id="pauseControlsInstructions"></div>
      <button id="pauseBtn" class="pause-btn">Resume</button>
      <button id="settingsBtn" class="pause-btn">⚙️ Settings</button>
    </div>
  </div>
  <div id="settingsPanel">
    <label>Speed<span><input type="range" id="speedRange" min="5" max="100" value="25" /></span></label>
    <label>Miss Penalty<input type="checkbox" id="missPenalty" /></label>
    <label>Music<input type="checkbox" id="musicToggle" checked /></label>
    <label>Sound FX<input type="checkbox" id="sfxToggle" checked /></label>
  </div>
  <div id="pauseScreen" class="hidden">
    <div class="start-content">
      <h1 class="main-title" id="pauseTitle">🎨 Dingus McGee</h1>
      <div id="pauseHint" class="pause-hint"></div>
      <div class="controls-instructions" id="pauseControlsInstructions"></div>
      <button id="resumeBtn" class="start-btn">Resume Game</button>
      <button id="openSettingsBtn" class="start-btn">⚙️ Settings</button>
      <div id="settingsPanel" class="settings-panel hidden">
        <h2 style="margin-top:0;font-size:1.1rem;color:#333;">Settings</h2>
        <label>Speed<span><input type="range" id="speedRange" min="5" max="100" value="25" /></span></label>
        <label>Miss Penalty<input type="checkbox" id="missPenalty" /></label>
        <label>Music<input type="checkbox" id="musicToggle" checked /></label>
        <label>Sound FX<input type="checkbox" id="sfxToggle" checked /></label>
      </div>
    </div>
  </div>
  <canvas id="gameCanvas" width="600" height="800"></canvas>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // --- DOM refs ---
      const startScreen = document.getElementById('startScreen');
      const mainActionBtn = document.getElementById('mainActionBtn');
      const mainSettingsBtn = document.getElementById('mainSettingsBtn');
      const mainSettingsPanel = document.getElementById('mainSettingsPanel');
      const mainCatcherSpeed = document.getElementById('mainCatcherSpeed');
      const mainFallSpeed = document.getElementById('mainFallSpeed');
      const mainMissPenalty = document.getElementById('mainMissPenalty');
      const mainMusicToggle = document.getElementById('mainMusicToggle');
      const mainSfxToggle = document.getElementById('mainSfxToggle');
      const mainControlsInstructions = document.getElementById('mainControlsInstructions');
      const pauseHint = document.getElementById('pauseHint');
      const resetCatcherSpeedBtn = document.getElementById('resetCatcherSpeedBtn');
      const resetFallSpeedBtn = document.getElementById('resetFallSpeedBtn');
      const hud = document.getElementById('hud');
      const gameOver = document.getElementById('gameOverScreen');
      const finalScoreEl = document.getElementById('finalScore');
      const restartBtn = document.getElementById('restartBtn');
      const scoreEl = document.getElementById('score');
      const xpEl = document.getElementById('xp');
      const levelEl = document.getElementById('level');
      const livesEl = document.getElementById('lives');
      const highScoreEl = document.getElementById('highScore');
      const targetColorBox = document.getElementById('targetColorBox');
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const feedback = document.getElementById('feedback');

      // --- State ---
      const DEFAULT_CATCHER_SPEED = 25;
      const DEFAULT_FALL_SPEED = 1.0;
      let state = {
        score: 0,
        lives: 3,
        maxLives: 3,
        xp: 0,
        level: 1,
        streak: 0,
        fallSpeed: DEFAULT_FALL_SPEED,
        baseSpawn: 600,
        lastSpawn: 0,
        paused: false,
        started: false,
        highScore: 0,
        missPenalty: false
      };
      let gameLoopId, lastTime = 0;
      const colors = ['#e74c3c','#2ecc71','#3498db','#f1c40f'];
      let targetColor = colors[0];

      // --- Controls Instructions ---
      function isMobile() {
        return /Android|iPhone|iPad|iPod|Opera Mini|IEMobile|WPDesktop/i.test(navigator.userAgent);
      }
      const desktopControls = `
        <h2>How to Play</h2>
        <ul>
          <li><b>Move:</b> <span class="kbd">←</span> <span class="kbd">→</span></li>
          <li><b>Change Catcher Speed:</b> <span class="kbd">A</span> / <span class="kbd">D</span></li>
          <li><b>Change Fall Speed:</b> <span class="kbd">W</span> / <span class="kbd">S</span></li>
          <li><b>Pause:</b> <span class="kbd">Space</span></li>
        </ul>
        <div class="tip">Catch the <span style="font-weight:bold;">target color</span> to score. Good luck!</div>
      `;
      const mobileControls = `
        <h2>How to Play</h2>
        <ul>
          <li><b>Move:</b> Drag left/right</li>
          <li><b>Change Fall Speed:</b> Swipe up/down</li>
          <li><b>Pause:</b> Two-finger tap</li>
        </ul>
        <div class="tip">Catch the <span style="font-weight:bold;">target color</span> to score. Good luck!</div>
      `;

      function updateStartScreenContent() {
        mainControlsInstructions.innerHTML = isMobile() ? mobileControls : desktopControls;
        pauseHint.textContent = isMobile() ? 'Two-finger tap to pause' : 'Space bar to pause';
        mainActionBtn.textContent = state.paused ? 'Resume Game' : 'Start Game';
      }

      // --- Show/hide start screen ---
      function showStartScreen(show, isPause = false) {
        state.paused = isPause;
        startScreen.classList.toggle('hidden', !show);
        updateStartScreenContent();
        mainSettingsPanel.classList.add('hidden');
      }

      // --- Minimal feedback ---
      let feedbackTimeout;
      function showFeedback(msg) {
        feedback.textContent = msg;
        feedback.classList.remove('hidden');
        feedback.style.opacity = 1;
        feedback.style.transform = "translateX(-50%) scale(0.8)";
        clearTimeout(feedbackTimeout);
        setTimeout(() => {
          feedback.style.transition = 'opacity 0.4s';
          feedback.style.opacity = 0;
          setTimeout(() => {
            feedback.classList.add('hidden');
            feedback.style.transition = '';
          }, 1000);
        }, 1000); // linger for 1 second
      }

      // --- Game logic ---
      const catcher = {
        w: canvas.width * 0.08,
        h: 20,
        r: 10,
        x: (canvas.width - canvas.width * 0.08) / 2,
        y: canvas.height - 40,
        speed: parseInt(mainCatcherSpeed.value),
        velX: 0
      };
      const circles = [];
      const particles = [];
      const keys = { left: false, right: false };
      function updateVel() { catcher.velX = (keys.right ? 1 : 0) - (keys.left ? 1 : 0); }
      function hexToRgb(h) {
        const c = h.slice(1);
        return `${parseInt(c.substr(0,2),16)},${parseInt(c.substr(2,2),16)},${parseInt(c.substr(4,2),16)}`;
      }
      function drawRounded(x,y,w,h,r) {
        ctx.beginPath();
        ctx.moveTo(x+r,y);
        ctx.lineTo(x+w-r,y);
        ctx.quadraticCurveTo(x+w,y,x+w,y+r);
        ctx.lineTo(x+w,y+h-r);
        ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
        ctx.lineTo(x+r,y+h);
        ctx.quadraticCurveTo(x,y+h,x,y+h-r);
        ctx.lineTo(x,y+r);
        ctx.quadraticCurveTo(x,y,x+r,y);
        ctx.fill();
      }
      function createParticles(x,y,color) {
        for (let i=0; i<20; i++) {
          particles.push({
            x, y,
            dx: (Math.random()-0.5)*4,
            dy: (Math.random()-0.5)*4,
            r: 3+Math.random()*3,
            alpha: 1,
            color
          });
        }
      }
      function updateParticles() {
        for (let i=particles.length-1; i>=0; i--) {
          let p = particles[i];
          p.x += p.dx;
          p.y += p.dy;
          p.alpha -= 0.02;
          if (p.alpha <= 0) particles.splice(i,1);
        }
      }
      function drawParticles() {
        particles.forEach(p => {
          ctx.fillStyle = `rgba(${hexToRgb(p.color)},${p.alpha})`;
          ctx.beginPath();
          ctx.arc(p.x,p.y,p.r,0,2*Math.PI);
          ctx.fill();
        });
      }
      function spawnCircle() {
        let baseSpd = 2 + state.score*0.05;
        circles.push({
          x: Math.random()*(canvas.width-30)+15,
          y: -20,
          r: 15 + Math.random()*10,
          baseSpd,
          spd: baseSpd * state.fallSpeed,
          color: colors[Math.floor(Math.random()*colors.length)]
        });
      }
      function drawBackground() {
        let t = Math.min(1, state.score/1000);
        let c1 = `hsl(${200-100*t},80%,70%)`;
        let c2 = `hsl(${50+50*t},90%,90%)`;
        let grad = ctx.createLinearGradient(0,0,0,canvas.height);
        grad.addColorStop(0,c1);
        grad.addColorStop(1,c2);
        ctx.fillStyle = grad;
        ctx.fillRect(0,0,canvas.width,canvas.height);
      }
      function drawCatcher() {
        ctx.fillStyle = '#222';
        drawRounded(catcher.x, catcher.y, catcher.w, catcher.h, catcher.r);
        ctx.fillStyle = targetColor;
        ctx.beginPath();
        ctx.arc(catcher.x+catcher.w/2, catcher.y+catcher.h+16, 12, 0, 2*Math.PI);
        ctx.fill();
      }
      function drawCircles() {
        circles.forEach(c => {
          ctx.fillStyle = c.color;
          ctx.beginPath();
          ctx.arc(c.x,c.y,c.r,0,2*Math.PI);
          ctx.fill();
        });
      }
      function updateXP(amount) {
        state.xp += amount;
        let need = state.level*100;
        while (state.xp >= need) {
          state.xp -= need;
          state.level++;
          need = state.level*100;
        }
        xpEl.textContent = state.xp;
        levelEl.textContent = state.level;
      }
      function update(dt) {
        if (Date.now() - state.lastSpawn > state.baseSpawn / state.fallSpeed) {
          spawnCircle();
          state.lastSpawn = Date.now();
        }
        catcher.x = Math.max(0, Math.min(canvas.width-catcher.w, catcher.x + catcher.velX * catcher.speed * (dt/16)));
        for (let i=circles.length-1; i>=0; i--) {
          let c = circles[i];
          c.spd = c.baseSpd * state.fallSpeed;
          c.y += c.spd;
          let caught = c.y+c.r >= catcher.y && c.x+c.r >= catcher.x && c.x-c.r <= catcher.x+catcher.w;
          let missed = c.y-c.r > canvas.height;
          if (caught || missed) {
            if (caught) {
              createParticles(c.x,c.y,c.color);
              if (c.color === targetColor) {
                state.score++;
                state.streak++;
                updateXP(10);
                targetColor = colors[Math.floor(Math.random()*colors.length)];
                if (state.score > state.highScore) {
                  state.highScore = state.score;
                  localStorage.setItem('highScore',state.highScore);
                  highScoreEl.textContent = state.highScore;
                }
              } else {
                state.lives--;
                state.streak = 0;
              }
              if (state.streak>0 && state.streak%10===0) {
                state.lives = Math.min(state.maxLives,state.lives+1);
              }
            }
            scoreEl.textContent = state.score;
            livesEl.textContent = state.lives;
            targetColorBox.style.backgroundColor = targetColor;
            circles.splice(i,1);
          }
        }
        updateParticles();
      }
      function gameLoop(ts) {
        if (state.paused) return;
        let dt = ts - lastTime;
        lastTime = ts;
        drawBackground();
        drawCatcher();
        drawCircles();
        drawParticles();
        update(dt);
        if (state.lives <= 0) {
          cancelAnimationFrame(gameLoopId);
          finalScoreEl.textContent = state.score;
          gameOver.classList.remove('hidden');
          return;
        }
        gameLoopId = requestAnimationFrame(gameLoop);
      }
      function startGame() {
        state.score = 0;
        state.lives = 3;
        state.xp = 0;
        state.level = 1;
        state.streak = 0;
        state.lastSpawn = 0;
        catcher.speed = DEFAULT_CATCHER_SPEED;
        state.fallSpeed = DEFAULT_FALL_SPEED;
        mainCatcherSpeed.value = DEFAULT_CATCHER_SPEED;
        mainFallSpeed.value = DEFAULT_FALL_SPEED * 10;
        scoreEl.textContent = '0';
        xpEl.textContent = '0';
        levelEl.textContent = '1';
        livesEl.textContent = '3';
        targetColor = colors[Math.floor(Math.random()*colors.length)];
        targetColorBox.style.backgroundColor = targetColor;
        startScreen.classList.add('hidden');
        hud.classList.remove('hidden');
        gameOver.classList.add('hidden');
        lastTime = performance.now();
        state.started = true;
        state.paused = false;
        gameLoopId = requestAnimationFrame(gameLoop);
      }
      function resumeGame() {
        state.paused = false;
        showStartScreen(false);
        hud.classList.remove('hidden');
        lastTime = performance.now();
        gameLoopId = requestAnimationFrame(gameLoop);
      }
      mainActionBtn.onclick = () => {
        if (!state.started) startGame();
        else resumeGame();
      };
      mainSettingsBtn.onclick = () => {
        mainSettingsPanel.classList.toggle('hidden');
      };
      mainCatcherSpeed.oninput = () => {
        catcher.speed = parseInt(mainCatcherSpeed.value);
        showFeedback(`Catcher Speed: ${catcher.speed}`);
      };
      mainFallSpeed.oninput = () => {
        state.fallSpeed = parseFloat(mainFallSpeed.value) / 10;
        showFeedback(`Fall Speed: ${state.fallSpeed.toFixed(1)}`);
      };
      resetCatcherSpeedBtn.onclick = () => {
        mainCatcherSpeed.value = DEFAULT_CATCHER_SPEED;
        catcher.speed = DEFAULT_CATCHER_SPEED;
        showFeedback(`Catcher Speed: ${catcher.speed}`);
      };
      resetFallSpeedBtn.onclick = () => {
        mainFallSpeed.value = DEFAULT_FALL_SPEED * 10;
        state.fallSpeed = DEFAULT_FALL_SPEED;
        showFeedback(`Fall Speed: ${state.fallSpeed.toFixed(1)}`);
      };
      // Keyboard controls
      document.addEventListener('keydown', e => {
        if (e.key === ' ') {
          if (!state.paused && state.started) {
            state.paused = true;
            showStartScreen(true, true);
            hud.classList.add('hidden');
          } else if (state.paused) {
            resumeGame();
          }
        }
        if (e.key === 'ArrowLeft') { keys.left = true; updateVel(); }
        if (e.key === 'ArrowRight') { keys.right = true; updateVel(); }
        if (e.key === 'w') {
          state.fallSpeed = Math.min(5, state.fallSpeed + 0.1);
          mainFallSpeed.value = Math.round(state.fallSpeed * 10);
          showFeedback(`Fall Speed: ${state.fallSpeed.toFixed(1)}`);
        }
        if (e.key === 's') {
          state.fallSpeed = Math.max(0.1, state.fallSpeed - 0.1);
          mainFallSpeed.value = Math.round(state.fallSpeed * 10);
          showFeedback(`Fall Speed: ${state.fallSpeed.toFixed(1)}`);
        }
        if (e.key === 'a') {
          catcher.speed = Math.min(100, catcher.speed + 5);
          mainCatcherSpeed.value = catcher.speed;
          showFeedback(`Catcher Speed: ${catcher.speed}`);
        }
        if (e.key === 'd') {
          catcher.speed = Math.max(5, catcher.speed - 5);
          mainCatcherSpeed.value = catcher.speed;
          showFeedback(`Catcher Speed: ${catcher.speed}`);
        }
      });
      document.addEventListener('keyup', e => {
        if (e.key === 'ArrowLeft') { keys.left = false; updateVel(); }
        if (e.key === 'ArrowRight') { keys.right = false; updateVel(); }
      });
      // Touch controls
      let touchOffset = 0;
      let swipeStartY = null;
      canvas.addEventListener('touchstart', e => {
        if (e.touches.length === 2) {
          if (!state.paused && state.started) {
            state.paused = true;
            showStartScreen(true, true);
            hud.classList.add('hidden');
          } else if (state.paused) {
            resumeGame();
          }
        } else {
          const rect = canvas.getBoundingClientRect();
          let x = e.touches[0].clientX - rect.left;
          touchOffset = x - catcher.x;
          swipeStartY = e.touches[0].clientY;
        }
      });
      canvas.addEventListener('touchmove', e => {
        const rect = canvas.getBoundingClientRect();
        let x = e.touches[0].clientX - rect.left;
        catcher.x = Math.max(0, Math.min(canvas.width - catcher.w, x - touchOffset));
        if (swipeStartY !== null) {
          let currentY = e.touches[0].clientY;
          let deltaY = currentY - swipeStartY;
          if (Math.abs(deltaY) > 30) {
            if (deltaY < 0) {
              state.fallSpeed = Math.min(5, state.fallSpeed + 0.1);
            } else {
              state.fallSpeed = Math.max(0.1, state.fallSpeed - 0.1);
            }
            mainFallSpeed.value = Math.round(state.fallSpeed * 10);
            showFeedback(`Fall Speed: ${state.fallSpeed.toFixed(1)}`);
            swipeStartY = currentY;
          }
        }
      });
      canvas.addEventListener('touchend', e => {
        swipeStartY = null;
      });
      // Restart
      restartBtn.onclick = () => {
        state.started = false;
        showStartScreen(true, false);
      };
      // Initial state
      showStartScreen(true, false);
    });
  </script>
  <style>
    #feedback {
      position:fixed;
      left:50%;
      top:80px;
      transform:translateX(-50%) scale(0.8);
      background:rgba(34,34,34,0.6);
      color:#fff;
      font-size:1rem;
      padding:6px 16px;
      border-radius:12px;
      box-shadow:0 2px 8px #0002;
      z-index:20;
      pointer-events:none;
      opacity:0;
      transition:opacity 0.4s, transform 0.2s;
    }
    #feedback:not(.hidden) { opacity:1; }
    #mainSettingsPanel button[type="button"] {
      font-size: 0.9em;
      padding: 2px 10px;
      border-radius: 8px;
      background: #eee;
      color: #333;
      border: 1px solid #bbb;
      margin-left: 8px;
      cursor: pointer;
      box-shadow: none;
      transition: background 0.2s;
    }
    #mainSettingsPanel button[type="button"]:hover {
      background: #ddd;
    }
  </style>
</body>
</html>
